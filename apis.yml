aid: human-security
name: HUMAN Security
description: |
  HUMAN Security (formerly PerimeterX) is an application security company
  focused on stopping automated abuse: sophisticated bots, account takeover,
  fake account creation, scraping, ad fraud, client-side supply-chain
  attacks, and transaction fraud. HUMAN operates the Human Defense Platform,
  which combines a JavaScript sensor and mobile SDKs running on the client
  with risk decisioning services on the server side. Products in the
  platform include Bot Defender (formerly PerimeterX Bot Defender),
  Account Defender, Credential Intelligence, Transaction Abuse Defense,
  Ad Fraud Sensor / MediaGuard, Code Defender (client-side script and
  supply-chain protection), and Scraper Protection. HUMAN is primarily an
  enterprise vendor — onboarding, sensor configuration, and policy tuning
  go through the HUMAN portal and a customer success team — but the
  platform exposes REST APIs and SDKs that engineering teams integrate into
  web apps, mobile apps, edge workers, and back-end services.
